name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # v4.0.2+ fixes "Failed to find package 'tools'" (legacy sdkmanager
      # package removed upstream), which failed run #1 on main.
      - uses: android-actions/setup-android@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Verify
        run: bash scripts/verify.sh
